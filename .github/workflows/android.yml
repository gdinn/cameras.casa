name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Unit tests are the project's real quality gate: besides the ViewModel/use-case/repository
  # tests, testDebugUnitTest also runs LayerDependencyTest (Konsist layering rules), StreamHostTest
  # (Kotlin constant vs. XML) and JacocoExclusionsTest (coverage patterns vs. compiled classes), so
  # an architecture violation fails this job like any other regression.
  unit-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # gradle/gradle-daemon-jvm.properties pins the Gradle daemon to a Java 21 toolchain.
          # The app itself still compiles against Java 17 (compileOptions in app/build.gradle.kts).
          java-version: '21'

      # v4 and the explicit package list are both deliberate: the obsolete `tools` package no
      # longer exists in the SDK repository, and v3 installs it by default, which fails the job
      # with "Failed to find package 'tools'". Everything else the build needs (platform 36,
      # build-tools) is downloaded by AGP itself, since this step accepts the SDK licenses.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # Also validates the checksum of the committed Gradle wrapper (validate-wrappers defaults to
      # true), which is what stops a tampered gradle-wrapper.jar from running here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build the coverage report
        run: ./gradlew :app:testDebugUnitTest :app:jacocoTestReport --stacktrace

      # Plugin resolution reports "not found in any of the following sources" for a 403 or a 503
      # just as it does for a genuine 404, and the HTTP detail is only printed at --info level. So
      # when a run fails, record what the runner actually gets back from the plugin repositories:
      # a 200 here means the build failed for some other reason, anything else names the culprit.
      - name: Probe the plugin repositories
        if: failure()
        run: |
          kotlin=$(sed -n 's/^kotlin = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          marker="org/jetbrains/kotlin/plugin/compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin"
          for base in https://repo1.maven.org/maven2 https://plugins.gradle.org/m2; do
            url="$base/$marker/$kotlin/org.jetbrains.kotlin.plugin.compose.gradle.plugin-$kotlin.pom"
            echo "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")  $url"
          done

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      # The HTML report carries the injected LINE-coverage banner; the XML is the machine-readable
      # input for any coverage service wired up later.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport
          if-no-files-found: ignore

  # assembleRelease runs R8 in full mode. A wrong keep rule fails at *runtime*, not here, so a green
  # job is necessary but not sufficient — docs/architecture.md §2 describes the device smoke test
  # that still has to follow any change to the keep rules, to a @Serializable model, or to the
  # VPN/WebRTC dependencies.
  build:
    name: Assemble debug and release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A v* tag is the only thing that produces a signed build. Pushes to main and pull requests
      # still run R8 and publish app-release-unsigned.apk, which is what catches a shrinking
      # failure early; what they do not do is touch the release key or mint an artifact that looks
      # installable. Every such build also carries version code 1, so it could not be a release
      # even if it were signed.
      - name: Read the release version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not v<major>.<minor>.<patch>, so no version code can be derived from it."
            exit 1
          fi
          echo "CAMERAS_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "::notice::Building version $version from tag $GITHUB_REF_NAME."

      # Signing material is all-or-nothing: a half-configured set of secrets is a mistake, not a
      # request for an unsigned build, so it fails here instead of quietly producing an APK nobody
      # can install.
      - name: Decode the release keystore
        id: signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=""
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -n "${!name:-}" ]; then present="$present $name"; else missing="$missing $name"; fi
          done

          if [ -z "$present" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release signing secrets configured - assembleRelease will produce an unsigned APK."
            exit 0
          fi

          if [ -n "$missing" ]; then
            echo "::error::Incomplete release signing configuration. Missing secrets:$missing"
            exit 1
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # A truncated or wrongly encoded secret otherwise surfaces much later, as an opaque
          # Gradle signing error.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$RELEASE_STORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::RELEASE_KEYSTORE_BASE64 did not decode into a keystore readable with RELEASE_STORE_PASSWORD."
            exit 1
          fi
          echo "CAMERAS_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # A v* tag is a release: publishing an unsigned APK under one would be a silent failure, so
      # it is caught before the build spends time on R8.
      - name: Require a signed APK on release tags
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed != 'true'
        run: |
          echo "::error::A v* tag must produce a signed release APK, but no signing secrets are configured."
          exit 1

      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Off a tag these resolve to empty strings, and the build script ignores blank values - the
      # passwords are not put in front of the build at all on an ordinary push.
      - name: Assemble the release APK
        env:
          CAMERAS_RELEASE_STORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.RELEASE_STORE_PASSWORD || '' }}
          CAMERAS_RELEASE_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.RELEASE_KEY_ALIAS || '' }}
          CAMERAS_RELEASE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.RELEASE_KEY_PASSWORD || '' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # The build falls back to an unsigned APK whenever any part of the material fails to reach
      # Gradle, so "the secrets are set" is not proof that the artifact is signed. This asserts it
      # against the APK that is about to be uploaded, and prints the certificate that signed it.
      - name: Verify the release APK signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools."
            exit 1
          fi
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Expected a signed $apk; the release build produced $(ls app/build/outputs/apk/release/*.apk)."
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Release stack traces are only readable with this file, and it is regenerated by every R8
      # run - keep the one that belongs to the APK above.
      - name: Upload the R8 mapping file
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  # Run artifacts expire (90 days by default) and are addressed by run id, which makes them a poor
  # home for a released build. On a v* tag the signed APK and its mapping file are attached to a
  # GitHub Release instead, where they keep a stable URL for as long as the tag exists.
  release:
    name: Publish the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Narrower than it looks: only this job can write to the repository, and only to create the
    # release. The jobs that compile and sign keep read-only access.
    permissions:
      contents: write
    steps:
      - name: Download the APKs
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: artifacts

      - name: Download the R8 mapping file
        uses: actions/download-artifact@v4
        with:
          name: release-mapping
          path: artifacts

      # mapping.txt is worth keeping next to the APK it belongs to: without the exact file from the
      # build that produced this binary, a crash report from the field cannot be de-obfuscated.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          apk="artifacts/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK in the build artifacts; refusing to publish a release."
            exit 1
          fi
          mv "$apk" "artifacts/cameras-$version.apk"
          mv artifacts/mapping.txt "artifacts/mapping-$version.txt"
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/cameras-$version.apk" \
            "artifacts/mapping-$version.txt" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
