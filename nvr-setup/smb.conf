# /etc/samba/smb.conf
# Read-only access to the camera recordings for authenticated VPN admins.

[global]
   server role = standalone server
   workgroup = WORKGROUP
   server string = Camera recordings

   # Logging
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

   # Network: SMB over TCP 445 only, no NetBIOS (the router and ufw only allow 445).
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB3

   # Third layer after the router and ufw: VPN admins, plus the Pi itself for tests.
   hosts allow = fd00:10::a:0/112 ::1 127.0.0.1
   hosts deny = ALL

   # Authentication: local users only, no guest and no anonymous sessions.
   security = user
   passdb backend = tdbsam
   map to guest = never
   restrict anonymous = 2

   # No printers on this host.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[backup_cams]
   comment = Camera recordings (USB disk)
   path = /mnt/backup_cams
   valid users = @smb_viewer
   # Hide the ext4 recovery folder (root only, useless to readers)
   veto files = /lost+found/
   guest ok = no
   read only = yes
   browseable = yes
