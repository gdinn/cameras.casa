# /etc/nvr/nvr.conf
# ============================================================
# Mini NVR — Configuration
# ============================================================
# Holds the camera credentials: keep it root:nvr 640.
# After a change, restart the recorders:
#   sudo systemctl restart 'nvr@*'
# ============================================================

# ----------------------------------------------------------
# Active cameras (space separated)
# Only these get an nvr@<camera> service enabled
# ----------------------------------------------------------
CAMERAS="cam_10 cam_11 cam_12 cam_13"

# ----------------------------------------------------------
# Stream URLs: <CAMERA>_URL, with the camera ID in upper case
# The recorder pulls the main stream straight from each camera
# ----------------------------------------------------------
CAM_10_URL="rtsp://<user>:<pass>@192.168.90.10:554/Channels/101"
CAM_11_URL="rtsp://<user>:<pass>@192.168.90.11:554/Channels/101"
CAM_12_URL="rtsp://<user>:<pass>@192.168.90.12:554/Channels/101"
CAM_13_URL="rtsp://<user>:<pass>@192.168.90.13:554/Channels/101"

# ----------------------------------------------------------
# Friendly names (used in logs): <CAMERA>_NAME
# ----------------------------------------------------------
CAM_10_NAME="Cam 1"
CAM_11_NAME="Cam 2"
CAM_12_NAME="Cam 3"
CAM_13_NAME="Cam 4"

# ----------------------------------------------------------
# Recording
# ----------------------------------------------------------

# Length of each file in seconds
#   900  = 15 minutes (recommended)
#   1800 = 30 minutes
#   3600 = 1 hour
SEGMENT_DURATION=900

# Codec: "copy" records without re-encoding (recommended)
# Use "libx264" only if the stream must be converted
VIDEO_CODEC="copy"

# ----------------------------------------------------------
# Storage
# ----------------------------------------------------------

# Root directory of the recordings (the USB disk mount point)
STORAGE_DIR="/mnt/backup_cams"

# Retention in days (older files are deleted)
RETENTION_DAYS=20

# Minimum free space in MB to keep recording
# Below it, the oldest files are deleted regardless of retention
MIN_FREE_SPACE_MB=204800

# ----------------------------------------------------------
# FFmpeg — advanced options
# ----------------------------------------------------------

# Connection timeout in microseconds (5 s)
RTSP_TIMEOUT=5000000

# RTSP transport: tcp (the router only allows TCP 554 to the cameras)
RTSP_TRANSPORT="tcp"

# FFmpeg log level: quiet, error, warning, info
FFMPEG_LOG_LEVEL="error"

# Reconnection attempts before giving up (0 = forever)
MAX_RECONNECT_ATTEMPTS=0

# Seconds between reconnection attempts
RECONNECT_DELAY=10
